# Cloud Build configuration for SyndiMatch Agents
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syndimatch-agents:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syndimatch-agents:latest'
      - '.'
    dir: 'agents'

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/syndimatch-agents:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/syndimatch-agents:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'syndimatch-agents'
      - '--image'
      - 'gcr.io/$PROJECT_ID/syndimatch-agents:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'MONGODB_URI=${_MONGODB_URI},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},CDP_API_KEY_NAME=${_CDP_API_KEY_NAME},CDP_API_KEY_PRIVATE_KEY=${_CDP_API_KEY_PRIVATE_KEY},CDP_NETWORK=${_CDP_NETWORK}'

images:
  - 'gcr.io/$PROJECT_ID/syndimatch-agents:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/syndimatch-agents:latest'

options:
  logging: CLOUD_LOGGING_ONLY

